<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF9F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>出发了么 · 福建六日亲子慢行</title>
<style>
/* ============================================================
   出发了么 · 通用旅行攻略页
   设计基调：清新绿 · 治愈高级（低饱和莫兰迪绿 + 奶白）
   ============================================================ */

:root{
  --green-deep:#2F5D50;   /* 深绿：标题、强调文字 */
  --green-main:#6B9E86;   /* 主色：按钮、选中态、时间轴节点 */
  --green-soft:#A8C4B4;   /* 浅绿：次级元素、分隔线 */
  --green-mist:#E8F0EB;   /* 极浅绿：卡片底、标签底 */
  --cream:#FAF9F5;        /* 奶白：页面背景 */
  --wood:#C9A87C;         /* 暖木色：点缀、数字、图标 */
  --text-main:#2A3B34;    /* 主文字 */
  --text-sub:#7A8B83;     /* 次级文字 */
  --shadow:0 2px 16px rgba(47,93,80,.06);
  --line:rgba(168,196,180,.4);   /* 分隔线 = --green-soft 40% 透明 */
  --nav-h:52px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--cream);
  color:var(--text-main);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.62;
  -webkit-font-smoothing:antialiased;
  /* 底部留出 tabbar + 刘海屏安全区 */
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;font-size:15px}
input{font-family:inherit;font-size:15px}
a{color:inherit;text-decoration:none}
img{display:block}

.app{max-width:430px;margin:0 auto;position:relative;overflow:hidden;min-height:100vh}

/* ---------- 顶部导航栏（初始透明叠加在图片上，滚动后奶白+模糊） ---------- */
.nav{
  position:fixed;top:0;left:0;right:0;max-width:430px;margin:0 auto;z-index:50;
  height:calc(var(--nav-h) + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) 18px 0;
  display:flex;align-items:center;gap:8px;
  background:transparent;
  transition:background .32s ease, box-shadow .32s ease, -webkit-backdrop-filter .32s ease;
}
.nav.solid{
  background:rgba(250,249,245,.82);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  backdrop-filter:saturate(180%) blur(14px);
  box-shadow:0 1px 0 var(--line);
}
.nav-brand{display:flex;align-items:center;gap:7px;opacity:0;transform:translateY(4px);transition:opacity .3s,transform .3s}
.nav.solid .nav-brand{opacity:1;transform:none}
.nav-brand b{font-size:16px;color:var(--green-deep);letter-spacing:.5px}
.nav-brand em{font-style:normal;font-size:12px;color:var(--text-sub)}
.nav-logo{width:26px;height:26px;border-radius:9px;background:linear-gradient(135deg,var(--green-soft),var(--green-main));
  display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:var(--shadow)}

/* ---------- 顶部 Hero：标题 + 城市网图卡片 ---------- */
.hero{position:relative;padding:calc(env(safe-area-inset-top) + 62px) 0 4px;overflow:hidden}
.hero-deco{position:absolute;top:0;left:0;width:100%;height:100%;opacity:.05;pointer-events:none}
.hero-inner{position:relative;padding:0 18px}
.big-title{display:flex;align-items:center;gap:10px}
.big-title h1{margin:0;font-size:31px;font-weight:800;color:var(--green-deep);letter-spacing:1.5px}
.big-title .leaf{font-size:22px;transform:rotate(-12deg)}
.sub-title{margin:7px 0 0;font-size:13.5px;color:var(--text-sub);line-height:1.55}
.sub-title b{color:var(--green-deep);font-weight:600}
.meta-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.meta-chip{background:var(--green-mist);color:var(--green-deep);font-size:12.5px;padding:5px 11px;border-radius:999px;font-weight:500}
.meta-chip i{font-style:normal;color:var(--wood)}

/* 城市横向滑动卡片 */
.cities{
  display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:14px 18px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.cities::-webkit-scrollbar{display:none}
.city-card{
  flex:0 0 min(78vw,320px);height:202px;position:relative;border-radius:20px;overflow:hidden;
  scroll-snap-align:start;box-shadow:var(--shadow);border:0;padding:0;display:block;
}
.city-fallback{position:absolute;inset:0}
.city-fallback svg{position:absolute;left:0;bottom:0;width:100%;height:46%}
.city-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s ease;background:transparent}
.city-img.loaded{opacity:1}
.city-mask{position:absolute;inset:0;background:linear-gradient(to top,rgba(47,93,80,.85) 0%,rgba(47,93,80,.35) 42%,transparent 72%)}
.city-info{position:absolute;left:16px;right:16px;bottom:14px;text-align:left}
.city-info .daytag{display:inline-block;font-size:11px;color:#fff;background:rgba(255,255,255,.22);
  border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:2px 9px;margin-bottom:6px}
.city-info .cname{font-size:20px;font-weight:700;color:#fff;letter-spacing:1px;line-height:1.2}
.city-info .ctag{font-size:13px;color:rgba(255,255,255,.8);margin-top:3px}
.dots{display:flex;gap:6px;justify-content:center;align-items:center;padding:2px 0 12px}
.dot{width:6px;height:6px;border-radius:999px;background:var(--green-soft);opacity:.5;transition:all .3s ease}
.dot.on{width:18px;background:var(--green-deep);opacity:1}

/* ---------- 通用卡片 ---------- */
.panel{display:none;padding:4px 18px 20px}
.panel.active{display:block;animation:fadeUp .34s cubic-bezier(.2,.7,.3,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card.mist{background:var(--green-mist)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-head h3{margin:0;font-size:16px;font-weight:700;color:var(--green-deep);display:flex;align-items:center;gap:7px}
.card-head .hint{font-size:12px;color:var(--text-sub);font-weight:400}
.sec-title{font-size:13px;font-weight:600;color:var(--green-main);letter-spacing:.5px;margin:14px 0 8px;display:flex;align-items:center;gap:6px}
.sec-title:first-child{margin-top:0}

/* 行程信息卡 */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}
.info-item .k{font-size:12px;color:var(--text-sub);display:flex;align-items:center;gap:5px}
.info-item .v{font-size:14.5px;color:var(--green-deep);font-weight:600;margin-top:2px;line-height:1.45}
.info-item.full{grid-column:1/-1}

/* ---------- Tab1 准备清单 ---------- */
.prog-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px}
.prog-row .num{font-size:14px;color:var(--text-sub)}
.prog-row .num b{font-size:20px;color:var(--green-deep);font-weight:700}
.link-btn{font-size:13px;color:var(--text-sub);padding:6px 10px;border-radius:999px;min-height:44px;
  display:inline-flex;align-items:center;background:rgba(255,255,255,.6)}
.link-btn:active{background:var(--green-mist)}
.bar{height:6px;background:#fff;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--green-main);border-radius:999px;transition:width .4s cubic-bezier(.2,.8,.2,1)}

.group{border-top:1px solid var(--line)}
.group:first-child{border-top:0}
.group-head{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:4px 0;text-align:left}
.group-head .gicon{font-size:17px;width:26px;text-align:center}
.group-head .gname{flex:1;font-size:15px;font-weight:600;color:var(--text-main)}
.group-head .gcount{font-size:12px;color:var(--text-sub)}
.group-head .chev{font-size:11px;color:var(--green-soft);transition:transform .28s ease}
.group.collapsed .chev{transform:rotate(-90deg)}
.group-body{overflow:hidden}
.group.collapsed .group-body{display:none}
.item{display:flex;align-items:flex-start;gap:11px;min-height:44px;padding:5px 0}
.box{
  width:22px;height:22px;flex:0 0 auto;margin-top:2px;border-radius:50%;
  border:1.6px solid var(--green-soft);background:#fff;position:relative;transition:.22s ease;
}
.item.done .box{background:var(--green-main);border-color:var(--green-main)}
.box::after{
  content:"";position:absolute;left:7px;top:3.5px;width:5px;height:9px;
  border:2px solid #fff;border-top:0;border-left:0;transform:rotate(42deg) scale(0);opacity:0;
}
.item.done .box::after{animation:pop .3s cubic-bezier(.34,1.6,.64,1) forwards}
@keyframes pop{0%{transform:rotate(42deg) scale(0);opacity:0}60%{transform:rotate(42deg) scale(1.25);opacity:1}100%{transform:rotate(42deg) scale(1);opacity:1}}
.txt{flex:1;font-size:15px;line-height:1.5;word-break:break-word}
.txt small{display:block;font-size:12.5px;color:var(--text-sub);margin-top:1px}
.item.done .txt{text-decoration:line-through;color:var(--text-sub)}
.del{width:44px;height:44px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  color:var(--green-soft);font-size:18px;margin-top:-11px}
.del:active{color:var(--green-deep)}
.add-row{display:flex;gap:6px;align-items:center;padding:2px 0 10px}
.add-row input{flex:1;height:44px;border:0;border-radius:999px;background:var(--green-mist);
  padding:0 15px;color:var(--text-main);outline:none;min-width:0}
.add-row input::placeholder{color:var(--text-sub)}
.add-row button{width:44px;height:44px;flex:0 0 auto;border-radius:50%;background:var(--green-main);
  color:#fff;font-size:21px;display:flex;align-items:center;justify-content:center;line-height:1}
.add-row button:active{transform:scale(.94)}

/* ---------- Tab2 路线地图 ---------- */
.map-inner{position:relative;width:100%;aspect-ratio:420/540;border-radius:16px;overflow:hidden;background:#FCFDFC}
.map-inner svg.map-svg{position:absolute;inset:0;width:100%;height:100%}
.layer{position:absolute;inset:0}
#amapBox{width:100%;height:420px;display:none}
#amapBox.on{display:block}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;
  background:none;padding:0;min-height:0}
.node .dot{width:30px;height:30px;border-radius:50%;background:#fff;border:2.5px solid var(--green-main);
  display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:var(--shadow);transition:.25s}
.node .lbl{margin-top:5px;font-size:12.5px;color:var(--green-deep);font-weight:600;background:rgba(255,255,255,.86);
  padding:1px 7px;border-radius:999px;white-space:nowrap}
.node.on .dot{background:var(--green-main);color:#fff;transform:scale(1.12)}
.badge{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;background:none;padding:0}
.badge .cir{width:38px;height:38px;border-radius:50%;background:var(--green-mist);border:1.5px solid var(--green-soft);
  display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:var(--shadow)}
.badge .t{margin-top:2px;font-size:11px;color:var(--green-deep);background:rgba(255,255,255,.9);
  padding:1px 7px;border-radius:999px;white-space:nowrap}
.map-tip{font-size:12px;color:var(--text-sub);margin-top:9px;text-align:center}
.bubble{position:absolute;transform:translate(-50%,-100%);background:#fff;border-radius:14px;box-shadow:0 8px 26px rgba(47,93,80,.16);
  padding:11px 13px;width:186px;text-align:left;display:none;z-index:5}
.bubble.on{display:block;animation:fadeUp .22s ease}
.bubble b{font-size:13.5px;color:var(--green-deep);display:flex;align-items:center;gap:5px}
.bubble p{margin:5px 0 0;font-size:12.5px;color:var(--text-sub);line-height:1.55}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:#fff;
  transform:translateX(-50%) rotate(45deg);box-shadow:3px 3px 8px rgba(47,93,80,.05)}
.route-flow{stroke:var(--green-main);stroke-width:3;fill:none;stroke-linecap:round;
  stroke-dasharray:9 9;animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-36}}

.city-detail .cd-head{display:flex;align-items:baseline;gap:9px;margin-bottom:10px}
.city-detail .cd-name{font-size:19px;font-weight:700;color:var(--green-deep)}
.city-detail .cd-stay{font-size:12.5px;color:var(--text-sub)}
.sight-list{list-style:none;margin:0;padding:0}
.sight-list li{position:relative;padding:5px 0 5px 15px;font-size:14.5px;line-height:1.55}
.sight-list li::before{content:"";position:absolute;left:2px;top:13px;width:6px;height:6px;border-radius:50%;background:var(--green-soft)}
.sight-list li b{font-weight:600}
.sight-list li span{color:var(--text-sub);font-size:12.5px;display:block}
/* 有坐标的地点：整行可点，唤起高德地图 */
.sight-list li.tappable{background:var(--green-mist);border-radius:14px;padding:9px 11px;margin:6px 0;
  display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.sight-list li.tappable::before{display:none}
.sight-list li.tappable>.d{display:block;width:100%}
.sight-row .pin{font-size:12px;display:inline;color:inherit}
.poi-go{display:inline-flex;align-items:center;gap:2px;background:var(--green-main);color:#fff;
  font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;min-height:28px;margin-left:auto}
.poi-go:active{background:var(--green-deep)}

/* ---------- 大众点评胶囊按钮 ---------- */
.pill-wrap{display:inline-flex;align-items:center;gap:4px;vertical-align:middle}
.pill{display:inline-flex;align-items:center;gap:3px;background:var(--green-mist);color:var(--green-deep);
  font-size:13.5px;padding:4px 9px 4px 11px;border-radius:999px;min-height:30px;font-weight:500}
.pill:active{background:var(--green-soft);color:#fff}
.pill .arw{font-size:13px;opacity:.55}
.pill-i{width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--green-soft);border:1px solid var(--line);border-radius:50%;flex:0 0 auto}
.eat-row{margin-top:13px;padding-top:11px;border-top:1px dashed var(--line)}
.eat-row .tip{font-size:12px;color:var(--text-sub);margin-bottom:7px}

/* ---------- Tab3 时间轴 ---------- */
.tl{position:relative;padding-left:28px}
.tl::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:1.5px;background:var(--green-soft);opacity:.55}
.tl-item{position:relative;margin-bottom:12px}
.tl-item::before{content:"";position:absolute;left:-25px;top:22px;width:11px;height:11px;border-radius:50%;
  background:var(--green-main);box-shadow:0 0 0 3.5px var(--cream)}
.tl-card{background:var(--cream);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.tl-head{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:14px 15px;min-height:60px}
.tl-day{font-size:12px;color:var(--wood);font-weight:700;letter-spacing:.6px;min-width:38px}
.tl-mid{flex:1;min-width:0}
.tl-city{font-size:15.5px;font-weight:700;color:var(--green-deep);display:flex;align-items:center;gap:6px}
.tl-city small{font-weight:400;font-size:12px;color:var(--text-sub)}
.tl-theme{font-size:12.5px;color:var(--text-sub);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-chev{font-size:11px;color:var(--green-soft);transition:transform .28s ease;flex:0 0 auto}
.tl-item.open .tl-chev{transform:rotate(90deg)}
.tl-body{display:none;padding:0 15px 15px}
.tl-item.open .tl-body{display:block;animation:fadeUp .3s ease}
.block{margin-top:12px}
.block .lb{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--green-main);
  background:var(--green-mist);border-radius:999px;padding:3px 10px}
.block ul{margin:7px 0 0;padding:0 0 0 4px;list-style:none}
.block li{position:relative;padding:3px 0 3px 14px;font-size:14.5px;line-height:1.6}
.block li::before{content:"";position:absolute;left:2px;top:13px;width:5px;height:5px;border-radius:50%;background:var(--green-soft)}
.tool-bar{display:flex;justify-content:flex-end;gap:8px;margin:0 0 12px}
.tool-btn{font-size:13px;color:var(--green-deep);background:#fff;border-radius:999px;padding:0 14px;min-height:44px;
  box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:5px}

/* 行程一览列表 */
.day-row{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.day-row:first-child{border-top:0}
.day-row .d{font-size:12.5px;color:var(--wood);font-weight:700;min-width:34px}
.day-row .c{font-size:14.5px;font-weight:600;color:var(--green-deep);min-width:34px}
.day-row .t{flex:1;font-size:13px;color:var(--text-sub);text-align:right}

/* ---------- 底部 Tab ---------- */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;max-width:430px;margin:0 auto;z-index:60;display:flex;
  background:rgba(250,249,245,.9);
  -webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);
  border-top:1px solid var(--line);
  padding:4px 6px calc(4px + env(safe-area-inset-bottom));
}
.tab{flex:1;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  color:var(--text-sub);border-radius:14px;transition:color .25s}
.tab .ico{font-size:19px;line-height:1}
.tab .lb{font-size:13px;line-height:1.2}
.tab.active{color:var(--green-deep)}
.tab.active .ico{transform:translateY(-1px)}
.tab.active .lb{font-weight:700}

/* 底部选择面板（大众点评 App / 浏览器） */
.sheet-mask{position:fixed;inset:0;z-index:300;display:none;align-items:flex-end;justify-content:center;
  background:rgba(42,59,52,.32);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.sheet-mask.on{display:flex;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:430px;background:var(--cream);border-radius:22px 22px 0 0;
  padding:20px 18px calc(14px + env(safe-area-inset-bottom));
  animation:sheetUp .26s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetUp{from{transform:translateY(24px);opacity:.5}to{transform:none;opacity:1}}
.sheet .s-title{font-size:17px;font-weight:700;color:var(--green-deep);text-align:center;line-height:1.4}
.sheet .s-tip{font-size:12.5px;color:var(--text-sub);text-align:center;margin:6px 0 15px}
.s-btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;border-radius:999px;
  font-size:15.5px;font-weight:600;background:#fff;color:var(--green-deep);margin-bottom:9px;
  box-shadow:var(--shadow);transition:transform .15s}
.s-btn:active{transform:scale(.98)}
.s-btn.primary{background:var(--green-main);color:#fff;box-shadow:0 4px 16px rgba(107,158,134,.3)}
.s-btn.cancel{background:transparent;color:var(--text-sub);font-weight:500;box-shadow:none;margin-bottom:0}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);
  background:rgba(47,93,80,.94);color:#fff;font-size:13.5px;padding:10px 16px;border-radius:999px;
  opacity:0;pointer-events:none;transition:.28s ease;z-index:200;max-width:80vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.foot{text-align:center;font-size:12px;color:var(--green-soft);padding:6px 0 16px}
</style>
</head>
<body>

<div class="app">

  <!-- 顶部导航 -->
  <header class="nav" id="nav">
    <div class="nav-brand">
      <span class="nav-logo">🌿</span>
      <b>出发了么</b>
      <em id="navSub"></em>
    </div>
  </header>

  <!-- 顶部区域 -->
  <div class="hero">
    <!-- 极淡水波纹 / 叶脉装饰，透明度 5% -->
    <svg class="hero-deco" viewBox="0 0 400 320" fill="none" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#2F5D50"/><stop offset="1" stop-color="#6B9E86"/>
        </linearGradient>

function gradient(i){
  return [
    'linear-gradient(160deg,#DCE6DE 0%,#9DBCAB 52%,#5E8C75 100%)',
    'linear-gradient(160deg,#E4EDDF 0%,#A9C6B1 52%,#67957E 100%)',

  ][i%4];
}
/* 用固定种子生成不同的天际线剪影，保证每个城市占位图都不一样 */
function skyline(seed){
  let s=seed*9301+49297, rand=()=>((s=(s*9301+49297)%233280)/233280);
  let x=0,d='';
  while(x<340){
    const w=14+rand()*24, h=26+rand()*66, y=120-h;
    d += `M${x.toFixed(1)} ${y.toFixed(1)}h${w.toFixed(1)}v${h.toFixed(1)}h-${w.toFixed(1)}z`;
    if(rand()>0.55) d += `M${(x+w/2-3).toFixed(1)} ${(y-9).toFixed(1)}h6v9h-6z`;
    x += w + 3 + rand()*7;
  }
  return `<svg viewBox="0 0 340 120" preserveAspectRatio="none"><path d="${d}" fill="#fff" opacity=".15"/></svg>`;
}

/* 取某个分组当前的全部条目（默认 + 自定义 - 已删除） */
function itemsOf(g){
  const def = CHECKLIST.find(x=>x.id===g.id).items;

function renderCheck(){

    }).join('');

        <ul style="list-style:none;margin:0;padding:0 0 2px">${rows}</ul>

          <button type="button" aria-label="添加">＋</button>
        </div>

  }).join('');

}
function updateProgress(){
  let total=0, done=0;
  CHECKLIST.forEach(g=>{
    const list=itemsOf(g); let gd=0;
    list.forEach(t=>{ if(st.checked[keyOf(g.id,t)]) {gd++; done++;} });
    total+=list.length;
    const box=$(`.group[data-g="${g.id}"]`); if(!box) return;
    box.querySelector('.gcount').textContent = gd+' / '+list.length;
  });
  $('#progText').innerHTML = '已完成 <b>'+done+'</b> / '+total;
  $('#progBar').style.width = total? (done/total*100)+'%' : '0%';
}
$('#checkRoot').addEventListener('click',e=>{
  const head=e.target.closest('.group-head');
  if(head){ head.parentElement.classList.toggle('collapsed'); return; }

  const del=e.target.closest('.del');
  if(del){
    const li=del.closest('.item'), k=li.dataset.k;
    const gid=k.split('|')[0], txt=k.slice(gid.length+1);
    /* 自定义条目直接删掉；默认条目记入 removed，避免刷新后又冒出来 */
    st.removed[k]=1; delete st.checked[k];
    if(st.custom[gid]) st.custom[gid]=st.custom[gid].filter(x=>x!==txt);
    save(); renderCheck(); return;
  }

  const li=e.target.closest('.item');
  if(li){
    const k=li.dataset.k;
    if(st.checked[k]) delete st.checked[k]; else st.checked[k]=1;
    li.classList.toggle('done'); save(); updateProgress(); return;
  }

});

/* =========================================================================
   Tab 2 · 路线地图
   ========================================================================= */
const routeCities = TRIP.route.slice(0,-1).map(n=>CITIES.find(c=>c.name===n));

/* ---------- 方案 B：手绘仿地图风格 SVG（无 Key 时的降级，始终可用） ---------- */
function buildSvgMap(){
  const W=420,H=540,PX=64,PY=72,MIN=92;
  const pts = routeCities.map(c=>({name:c.name}));
  routeCities.forEach((c,i)=>{ pts[i].lng=c.lng; pts[i].lat=c.lat; });

  const lngs=pts.map(p=>p.lng), lats=pts.map(p=>p.lat);
  const minL=Math.min(...lngs), maxL=Math.max(...lngs);
  const minA=Math.min(...lats), maxA=Math.max(...lats);
  pts.forEach(p=>{
    p.gx = PX + (p.lng-minL)/((maxL-minL)||1)*(W-2*PX);
    p.gy = PY + (maxA-p.lat)/((maxA-minA)||1)*(H-2*PY);
    p.x=p.gx; p.y=p.gy;
  });
  /* 距离太近的城市互相推开一点，避免标记叠在一起 */
  for(let it=0;it<80;it++){
    let moved=false;
    for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
      const a=pts[i],b=pts[j]; let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.01;
      if(d<MIN){ const push=(MIN-d)/2,ux=dx/d,uy=dy/d;
        a.x-=ux*push;a.y-=uy*push;b.x+=ux*push;b.y+=uy*push;moved=true; }
    }
    if(!moved) break;
  }
  pts.forEach(p=>{ p.x=Math.min(Math.max(p.x,46),W-46); p.y=Math.min(Math.max(p.y,52),H-52); });

  /* 背景：奶白 + 浅绿道路网格 */
  let grid='';
  for(let x=30;x<W;x+=38) grid+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="#A8C4B4" stroke-width="1" opacity=".16"/>`;
  for(let y=28;y<H;y+=38) grid+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="#A8C4B4" stroke-width="1" opacity=".16"/>`;
  grid+=`<line x1="0" y1="${H*0.42}" x2="${W}" y2="${H*0.36}" stroke="#A8C4B4" stroke-width="3" opacity=".2"/>`;
  grid+=`<line x1="40" y1="${H}" x2="${W-60}" y2="0" stroke="#A8C4B4" stroke-width="3" opacity=".18"/>`;
  /* 海面：右下角一块极浅绿 */
  const sea=`<path d="M${W} ${H-150} C ${W-90} ${H-120}, ${W-130} ${H-60}, ${W} ${H} Z" fill="#E8F0EB" opacity=".7"/>`;

  const dPath = pts.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
  /* 引线：真实经纬度位置 ↔ 为避让而挪动后的标记位置 */
  let lead='';
  pts.forEach(p=>{ if(Math.hypot(p.x-p.gx,p.y-p.gy)>6)
    lead+=`<line x1="${p.gx.toFixed(1)}" y1="${p.gy.toFixed(1)}" x2="${p.x.toFixed(1)}" y2="${p.y.toFixed(1)}" stroke="#A8C4B4" stroke-width="1" stroke-dasharray="2 3" opacity=".7"/>`;
  });

  /* 比折线段数多出来的那条交通（返程）单独画一条向左弯的虚线，避免和去程折线重叠 */
  let retPath='', retMid=null;
  if(LINES.length >= pts.length){
    const A=pts[0], B=pts[pts.length-1];
    const mx=(A.x+B.x)/2, my=(A.y+B.y)/2;
    let px=-(B.y-A.y), py=(B.x-A.x);                 /* 法向量 */
    const len=Math.hypot(px,py)||1; px=px/len; py=py/len;
    if(px>0){ px=-px; py=-py; }                      /* 让控制点统一朝左偏 */
    const cx=mx+px*115, cy=my+py*115;
    retPath=`<path d="M${B.x.toFixed(1)} ${B.y.toFixed(1)} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${A.x.toFixed(1)} ${A.y.toFixed(1)}"
      stroke="#A8C4B4" stroke-width="2.5" fill="none" stroke-dasharray="4 6" opacity=".8"/>`;
    retMid={ x:(B.x+2*cx+A.x)/4, y:(B.y+2*cy+A.y)/4 };   /* 二次贝塞尔曲线的中点 */
  }

  /* 交通徽章放在每段中点 */
  const badges = LINES.map((L,i)=>{
    let mx,my;
    if(i < pts.length-1){
      const a=pts[i], b=pts[i+1];
      mx=(a.x+b.x)/2; my=(a.y+b.y)/2;
    }else if(retMid){
      mx=retMid.x; my=retMid.y;
    }else{
      mx=pts[0].x; my=Math.min(pts[0].y+66,H-52);
    }
    return `<button class="badge" data-line="${i}" style="left:${(mx/W*100).toFixed(2)}%;top:${(my/H*100).toFixed(2)}%">
      <span class="cir">${L.icon}</span><span class="t">${esc(L.times)}</span></button>`;
  }).join('');

  const nodes = pts.map(p=>
    `<button class="node" data-city="${esc(p.name)}" style="left:${(p.x/W*100).toFixed(2)}%;top:${(p.y/H*100).toFixed(2)}%">
      <span class="dot">📍</span><span class="lbl">${esc(p.name)}</span></button>`).join('');

  $('#svgMap').innerHTML =
    `<svg class="map-svg" viewBox="0 0 ${W} ${H}">
      <rect width="${W}" height="${H}" fill="#FCFDFC"/>
      ${sea}${grid}${lead}${retPath}
      <path d="${dPath}" stroke="#E8F0EB" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path class="route-flow" d="${dPath}"/>
    </svg>
    <div class="layer">${nodes}${badges}<div class="bubble" id="bubble"></div></div>`;
}

/* ---------- 方案 A：高德地图（填了 Key 才会加载） ---------- */

/* 地点信息窗：点地图上的景点/住宿小圆点时弹出，里面有个「在高德地图中查看」按钮 */
let poiWin=null;
function showPoiWin(map,name,lng,lat,desc){
  const html=`<div style="min-width:160px;max-width:220px">
    <div style="font-size:14px;font-weight:700;color:#2F5D50">${esc(name)}</div>
    ${desc?`<div style="font-size:12px;color:#7A8B83;margin-top:4px;line-height:1.5">${esc(desc)}</div>`:''}
    <button class="poi-go" data-ll="${lng},${lat}" data-nm="${esc(name)}"
      style="margin:9px 0 2px;width:100%;min-height:38px;justify-content:center;font-size:13px">看地图 ›</button>
  </div>`;
  if(!poiWin) poiWin=new AMap.InfoWindow({offset:new AMap.Pixel(0,-12)});
  poiWin.setContent(html);
  poiWin.open(map,[lng,lat]);
}

function buildAMap(){
  const map=new AMap.Map('amapBox',{
    zoom:6.4, viewMode:'2D',
    center:[(116.41+119.30)/2,(39.90+24.48)/2],
    /* 想更贴配色，去高德控制台「自定义地图样式」做一个绿调样式，把下面的 id 换掉即可 */
    mapStyle:'amap://styles/whitesmoke'
  });
  amap = map;
  map.on('complete',()=>{                 /* 瓦片真正渲染出来才算成功 */
    amapOK = true;
    if(amapTimer){ clearTimeout(amapTimer); amapTimer=null; }
    if(mapModeAm) showAMap(); else showSvg('手绘示意图');
  });
  const path=routeCities.map(c=>[c.lng,c.lat]);
  map.add(new AMap.Polyline({path,borderWeight:1,strokeWeight:4,strokeColor:'#6B9E86',
    strokeOpacity:.9,strokeStyle:'dashed',lineJoin:'round'}));
  routeCities.forEach(c=>{
    const m=new AMap.Marker({
      position:[c.lng,c.lat], offset:new AMap.Pixel(-16,-16), anchor:'center',
      content:`<div style="width:32px;height:32px;border-radius:50%;background:#fff;border:2.5px solid #6B9E86;
        display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 2px 12px rgba(47,93,80,.18)">📍</div>
        <div style="margin-top:3px;font-size:12px;color:#2F5D50;background:rgba(255,255,255,.9);
        padding:1px 7px;border-radius:999px;white-space:nowrap">${c.name}</div>`
    });
    m.on('click',()=>openCity(c.name)); map.add(m);
  });

  /* 景点 + 住宿逐个打点（只有填了 lng/lat 的才会出现），点一下弹信息窗，可唤起高德地图 */
  CITIES.forEach(c=>{
    (c.sights||[]).forEach(s=>{
      if(s.lng===undefined||s.lat===undefined) return;
      const m=new AMap.Marker({
        position:[s.lng,s.lat], offset:new AMap.Pixel(-8,-8), anchor:'center',
        content:`<div style="width:15px;height:15px;border-radius:50%;background:#6B9E86;border:2px solid #fff;
          box-shadow:0 1px 6px rgba(47,93,80,.35)"></div>`
      });
      m.on('click',()=>showPoiWin(map,'📍 '+s.n,s.lng,s.lat,s.d));
      map.add(m);
    });
    if(c.hotelLL){
      const m=new AMap.Marker({
        position:c.hotelLL, offset:new AMap.Pixel(-9,-9), anchor:'center',
        content:`<div style="width:18px;height:18px;border-radius:50%;background:#C9A87C;border:2px solid #fff;
          box-shadow:0 1px 6px rgba(47,93,80,.35);display:flex;align-items:center;justify-content:center;font-size:9px">🏨</div>`
      });
      m.on('click',()=>showPoiWin(map,'🏨 '+c.hotel,c.hotelLL[0],c.hotelLL[1],'这一站住的地方'));
      map.add(m);
    }
  });

  const addBadge=(L,lng,lat)=>{
    const m=new AMap.Marker({
      position:[lng,lat], offset:new AMap.Pixel(-19,-19), anchor:'center',
      content:`<div style="width:38px;height:38px;border-radius:50%;background:#E8F0EB;border:1.5px solid #A8C4B4;
        display:flex;align-items:center;justify-content:center;font-size:17px">${L.icon}</div>
        <div style="margin-top:2px;font-size:11px;color:#2F5D50;background:rgba(255,255,255,.9);
        padding:1px 7px;border-radius:999px;white-space:nowrap">${L.times}</div>`
    });
    m.on('click',()=>toast(L.icon+' '+L.from+' → '+L.to+'：'+L.text+'。'+L.detail));
    map.add(m);
  };
  LINES.forEach((L,i)=>{
    const a=routeCities[i], b=routeCities[i+1];
    if(!b){                                   /* 最后一条 = 返程，画一条浅色虚线回出发地 */
      const s=routeCities[0], e=routeCities[routeCities.length-1];
      map.add(new AMap.Polyline({path:[[e.lng,e.lat],[s.lng,s.lat]],strokeWeight:2,
        strokeColor:'#A8C4B4',strokeOpacity:.85,strokeStyle:'dashed'}));
      addBadge(L,(e.lng+s.lng)/2,(e.lat+s.lat)/2);
      return;
    }
    addBadge(L,(a.lng+b.lng)/2,(a.lat+b.lat)/2);
  });
  map.setFitView();
}

/* ---------- 手绘图 / 高德地图 两种状态互切 ---------- */
let amap=null, amapOK=false, amapStarted=false, mapModeAm=true, amapTimer=null;
function setMode(t){ const el=$('#mapMode'); if(el) el.textContent=t; }
function showSvg(msg){
  mapModeAm=false;
  $('#amapBox').classList.remove('on');
  $('#svgMap').style.display='';
  setMode(msg||'手绘示意图');
  const t=$('#mapToggle'); if(t){ t.hidden=!amapOK; t.textContent='⇄ 换成高德地图'; }
}
function showAMap(){
  if(!amapOK){ toast('地图还没加载完，先用手绘示意图'); return; }
  mapModeAm=true;
  $('#svgMap').style.display='none';
  $('#amapBox').classList.add('on');
  setMode('高德地图');
  $('#mapToggle').textContent='⇄ 换成手绘示意图';
  /* 容器从隐藏变可见时高德必须 resize 一次，否则还是空白 */
  setTimeout(()=>{ try{ amap && amap.resize && amap.resize(); }catch(e){} },150);
}

/* 关键：地图必须等 Tab2 真正显示时才初始化。
   在隐藏的容器里初始化，高德拿到的是 0 宽高，渲染出来就是一片空白。 */
function initMap(){
  buildSvgMap();                                   // 手绘图先备好，永远有底，不会白屏
  if(!AMAP_KEY || AMAP_KEY==='YOUR_KEY_HERE'){ showSvg('手绘示意图'); return; }
  if(amapStarted) return;
  amapStarted=true;
  if(AMAP_SECURITY) window._AMapSecurityConfig={securityJsCode:AMAP_SECURITY};
  setMode('正在加载地图…');
  const s=document.createElement('script');
  s.src=`https://webapi.amap.com/maps?v=2.0&key=${AMAP_KEY}`;
  s.onerror=()=>showSvg('手绘示意图（地图加载失败）');
  s.onload=()=>{
    if(typeof AMap==='undefined'){ showSvg('手绘示意图（地图未就绪）'); return; }
    try{ buildAMap(); }catch(err){ showSvg('手绘示意图（初始化失败）'); return; }
    /* 超过 MAP_TIMEOUT 还没渲染出瓦片就当失败，自动退回手绘图 */
    amapTimer=setTimeout(()=>{ if(!amapOK) showSvg('手绘示意图（加载超时）'); }, MAP_TIMEOUT);
  };
  document.head.appendChild(s);
}
initMap();     // 页面加载时只画手绘图；高德等切到「这样玩」这一屏再初始化

$('#mapToggle').addEventListener('click',()=>{ mapModeAm ? showSvg('手绘示意图') : showAMap(); });

/* ---------- 交通气泡 ---------- */
function showBubble(html, x, y, W, H){
  const b=$('#bubble'); if(!b) return;
  b.innerHTML=html;
  b.style.left=(x/W*100)+'%'; b.style.top=(y/H*100-4)+'%';
  b.classList.add('on');
}
(function bindMapEvents(){
  const inner=$('#mapInner');
  inner.addEventListener('click',e=>{
    const node=e.target.closest('.node');
    if(node){ inner.querySelectorAll('.node').forEach(n=>n.classList.remove('on'));
      node.classList.add('on'); openCity(node.dataset.city); return; }
    const bg=e.target.closest('.badge');
    if(bg){
      const i=+bg.dataset.line, L=LINES[i];
      const b=$('#bubble');
      const wasOn = b.classList.contains('on') && b.dataset.for==='line'+i;
      b.classList.remove('on');
      if(wasOn) return;
      b.dataset.for='line'+i;
      const rect=inner.getBoundingClientRect();
      showBubble(`<b>${L.icon} ${esc(L.from)} → ${esc(L.to)}</b><p>${esc(L.detail)}</p>`,
        parseFloat(bg.style.left), parseFloat(bg.style.top), 100, 100);
      return;
    }
    const bb=$('#bubble'); if(bb && !e.target.closest('#bubble')) bb.classList.remove('on');
  });
})();

/* ---------- 城市行程卡片 ---------- */
function openCity(name){
  const c=CITIES.find(x=>x.name===name); if(!c) return;
  const eats=c.eats.length?`<div class="sec-title">🍽 吃什么</div>`+c.eats.map(e=>eatPill(e,c.name)).join('<br>') : '';
  const hotel=(c.hotel&&c.hotelLL)?`<div class="sec-title">🏨 住哪儿</div><ul class="sight-list">`+
      poiRow(c.hotel,c.hotelLL[0],c.hotelLL[1],'点一下在高德地图里看位置（可以先收藏）')+`</ul>`
      +eatPill({n:c.hotel},c.name) : (c.hotel?`<div class="sec-title">🏨 住哪儿</div>${eatPill({n:c.hotel},c.name)}`:'');
  const sights=c.sights.length?`<div class="sec-title">👀 玩什么 · 点任一行看地图</div><ul class="sight-list">`+
      c.sights.map(s=>poiRow(s.n,s.lng,s.lat,s.d)).join('')+`</ul>` : '';

  $('#cityDetail').innerHTML = `
    <div class="cd-head"><span class="cd-name">${esc(c.name)}</span><span class="cd-stay">${esc(c.alt?'出发地':c.stay)}</span>
      <button class="poi-go" data-ll="${c.lng},${c.lat}" data-nm="${esc(c.name)}">📍 看城市地图</button></div>
    <div class="card-head" style="margin:0 0 10px"><h3 style="font-size:15px">💬 提示</h3></div>
    <p style="margin:0;font-size:14px;color:var(--text-sub);line-height:1.6">${esc(c.note || c.tag+'。这一段走得慢一点，别赶行程。')}</p>
    ${sights}${eats}${hotel}`;
  $('#cityDetail').scrollIntoView({behavior:'smooth',block:'nearest'});
}
/* 点评胶囊按钮：真链接 + target=_blank，手机上点一下就能跳（不会被弹窗拦截） */
function eatPill(e, city){
  return `<span class="pill-wrap"><a class="pill" href="${dpLink(e.n)}" target="_blank" rel="noopener"
    data-shop="${esc(e.n)}" data-city="${esc(city||'')}">${esc(e.n)}<span class="arw">›</span></a><span class="pill-i"
    data-tip="点店名：可用点评 App 或高德地图打开">i</span></span>
    ${e.d?`<span style="font-size:12.5px;color:var(--text-sub);margin-left:6px">${esc(e.d)}</span>`:''}`;
}
/* 有坐标的地点行：整行可点，点了唤起高德地图看这个点 */
function poiRow(name, lng, lat, desc, icon){
  const has = (lng!==undefined && lat!==undefined);
  return `<li class="sight-row${has?' tappable':''}" data-ll="${has?lng+','+lat:''}" data-nm="${esc(name)}">
    ${has?'<span class="pin">📍</span>':''}<b>${esc(name)}</b>
    ${has?'<span class="poi-go" data-ll="'+lng+','+lat+'" data-nm="'+esc(name)+'">看地图 ›</span>':''}
    <span class="d">${esc(desc||'')}</span></li>`;
}
openCity('福州');

/* ---------- 行程一览 ---------- */
$('#dayList').innerHTML = DAYS.map((d,i)=>
  `<button class="day-row" data-day="${i}">
     <span class="d">${esc(dayDate(i))}</span>
     <span class="c">Day${d.n}</span>
     <span class="t">${d.trans} · ${esc(d.theme)}</span>
   </button>`).join('');
$('#dayList').addEventListener('click',e=>{
  const r=e.target.closest('.day-row'); if(!r) return;
  goTab(2); setTimeout(()=>openDay(+r.dataset.day),260);
});

/* =========================================================================
   Tab 3 · 时间轴
   ========================================================================= */
$('#timeline').innerHTML = DAYS.map((d,i)=>{
  const blocks = d.blocks.map(b=>`
    <div class="block"><span class="lb">${b.icon} ${b.t}</span>
      <ul>${b.list.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    </div>`).join('');
  const eats = d.eats && d.eats.length ? `<div class="eat-row">
      <div class="tip">🍽 这一天吃什么 —— 点店名跳转大众点评</div>
      ${d.eats.map(e=>eatPill(e,d.city)).join('<br>')}
    </div>` : '';
  return `<div class="tl-item" id="day-${i}">
    <button class="tl-card" style="width:100%;text-align:left;padding:0;display:block">
      <div class="tl-head">
        <span class="tl-day">Day${d.n}</span>
        <span class="tl-mid">
          <span class="tl-city">${esc(d.city)} <small>${esc(dayDate(i))}</small></span>
          <span class="tl-theme">${d.trans} · ${esc(d.theme)}</span>
        </span>
        <span class="tl-chev">›</span>
      </div>
    </button>
    <div class="tl-body">${blocks}${eats}</div>
  </div>`;
}).join('');
$('#timeline').addEventListener('click',e=>{
  const it=e.target.closest('.tl-item'); if(!it) return;
  if(e.target.closest('.pill')||e.target.closest('.pill-i')) return;
  it.classList.toggle('open');
});
function openDay(i){
  const it=$('#day-'+i); if(!it) return;
  it.classList.add('open');
  it.scrollIntoView({behavior:'smooth',block:'center'});
}
$('#expandAll').onclick =()=>$$('#timeline .tl-item').forEach(x=>x.classList.add('open'));
$('#collapseAll').onclick=()=>$$('#timeline .tl-item').forEach(x=>x.classList.remove('open'));

/* =========================================================================
   跳转 1：大众点评
   胶囊按钮本身就是 <a href target="_blank">，点一下是浏览器原生跳转，
   不会被手机浏览器的弹窗拦截（之前把 window.open 放进 setTimeout 里，
   用户手势已经失效，所以手机上点了没反应）。
   ========================================================================= */
/* openAMap / dpLink / dpSearch 都定义在脚本顶部「跳转工具」区，这里不重复定义 */

document.addEventListener('click',e=>{
  /* ⓘ 小提示图标：只弹提示，不跳转 */
  const tip=e.target.closest('.pill-i');
  if(tip){ e.preventDefault(); e.stopPropagation(); toast(tip.dataset.tip||'将跳转大众点评搜索'); return; }

  /* 「📍 高德」按钮（景点信息窗 / 城市卡片里的那颗按钮） */
  const go=e.target.closest('.poi-go');
  if(go){ e.preventDefault(); e.stopPropagation();
    const ll=(go.dataset.ll||'').split(',');
    if(ll.length===2 && ll[0]) openAMap(ll[0],ll[1],go.dataset.nm||'目的地');
    return;
  }

  /* 城市卡片里点景点 / 住宿这一整行 → 直接唤起高德看这个地点 */
  const row=e.target.closest('.sight-row');
  if(row){ e.stopPropagation();
    const ll=(row.dataset.ll||'').split(',');
    if(ll.length===2 && ll[0]) openAMap(ll[0],ll[1],row.dataset.nm||'目的地');
    else toast('这个地点还没填坐标，填了 lng/lat 才能唤起高德');
    return;
  }

  /* 点评胶囊：手机弹选择面板；桌面直接新窗口打开网页版 */
  const p=e.target.closest('.pill');
  if(p){
    const n=p.dataset.shop;
    e.stopPropagation();
    if(SHOP_SHEET && /iPhone|iPad|Android|Mobile/i.test(navigator.userAgent)){
      e.preventDefault();                 // 拦住 <a> 的直跳，改用面板（直跳在手机上经常落到登录页）
      openShopSheet(n, p.dataset.city);
      return;
    }
    toast('正在跳转大众点评搜索「'+n+'」');
  }
});

/* 选择面板的交互 */
(function(){
  const mask=$('#sheet');
  if(!mask) return;
  mask.addEventListener('click',e=>{
    if(e.target===mask){ mask.classList.remove('on'); return; }   // 点遮罩关掉
    const btn=e.target.closest('.s-btn'); if(!btn) return;
    const act=btn.dataset.act, name=mask.dataset.shop||'', city=mask.dataset.city||'';
    mask.classList.remove('on');
    if(act==='cancel') return;
    if(act==='amap'){ openAMapSearch(name,city); return; }
    if(act==='app'){
      /* 唤起 App：同一次点击手势内执行，不会被浏览器拦截 */
      let left=false;
      const onHide=()=>{ left=true; };
      document.addEventListener('visibilitychange',onHide,{once:true});
      location.href = dpAppLink(name);
      /* 1.5 秒后页面还在这儿 = 没装点评 App → 自动改用高德地图搜这家店
         （同样是改 location.href，属于普通导航，不会被当成弹窗拦掉） */
      setTimeout(()=>{
        document.removeEventListener('visibilitychange',onHide);
        if(!left && !document.hidden){
          toast('没检测到点评 App，改用高德地图搜索');
          location.href = amapSearchUrl(name,city);
        }
      },1500);
    }
  });
})();
